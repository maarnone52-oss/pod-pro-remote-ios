# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen)
name: PODProRemote
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  PODProRemote:
    type: application
    platform: iOS
    sources:
      - path: PODProRemote
        excludes:
          - "Web/**"
      - path: PODProRemote/Web
        type: folder
        buildPhase: resources
    info:
      path: PODProRemote/Info.plist
      properties:
        CFBundleDisplayName: POD Pro Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "Serve per collegare un adattatore MIDI Bluetooth al POD."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: PODProRemote
        PRODUCT_BUNDLE_IDENTIFIER: it.podproremote.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
    scheme: {}
