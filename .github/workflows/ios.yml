# Compila l'app su un Mac di GitHub.
# - "Verifica": controlla che l'app si compili (non serve nessun account Apple).
# - "TestFlight": la firma e la carica su TestFlight, se sono stati inseriti i segreti Apple.
#   Ogni modifica caricata su GitHub produce la versione PROVA ("POD Pro PROVA").
#   La versione definitiva ("POD Pro Remote") parte solo a mano:
#   Actions > App iOS > Run workflow > versione: definitiva.
name: App iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versione:
        description: "Quale app caricare su TestFlight"
        type: choice
        options: [prova, definitiva]
        default: prova

jobs:
  verifica:
    name: Verifica
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Usa Xcode 26 o successivo (richiesto da Apple)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 non disponibile su questo Mac di GitHub"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild -project PODProRemote.xcodeproj -scheme PODProRemote \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: Salva il progetto Xcode
        run: zip -qry PODProRemote-Xcode.zip PODProRemote.xcodeproj PODProRemote project.yml

      - uses: actions/upload-artifact@v4
        with:
          name: progetto-xcode
          path: PODProRemote-Xcode.zip

  testflight:
    name: TestFlight
    needs: verifica
    runs-on: macos-15
    env:
      VERSIONE: ${{ github.event.inputs.versione || 'prova' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ github.event.inputs.versione == 'definitiva' && secrets.APP_BUNDLE_ID || secrets.APP_BUNDLE_ID_PROVA }}
      APP_NAME: ${{ github.event.inputs.versione == 'definitiva' && 'POD Pro Remote' || 'POD Pro PROVA' }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Controlla i segreti Apple
        id: check
        run: |
          echo "Versione: $VERSIONE ($APP_NAME)"
          if [ -n "$TEAM_ID" ] && [ -n "$BUNDLE_ID" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Segreti Apple per la versione $VERSIONE non inseriti: salto l'invio a TestFlight."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Usa Xcode 26 o successivo (richiesto da Apple)
        if: steps.check.outputs.ok == 'true'
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 non disponibile su questo Mac di GitHub"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Prepara chiave e progetto
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          brew install xcodegen
          xcodegen generate

      - name: Archivia e firma
        if: steps.check.outputs.ok == 'true'
        run: |
          set -o pipefail
          xcodebuild -project PODProRemote.xcodeproj -scheme PODProRemote \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/PODProRemote.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            APP_DISPLAY_NAME="$APP_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60

      - name: Carica su TestFlight
        if: steps.check.outputs.ok == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PODProRemote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 60
